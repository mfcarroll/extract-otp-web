version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Wait before proposing new releases so hijacked versions are likely caught and yanked first.
    cooldown:
      default-days: 14
    groups:
      dev:
        dependency-type: development
      prod:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
